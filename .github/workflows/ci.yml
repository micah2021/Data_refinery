name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 tests scripts validation setup_db.py

      - name: Run mypy (optional)
        continue-on-error: true
        run: mypy validation/validate_schema.py

      - name: Run pytest
        run: pytest -q

      - name: Run safety check
        run: |
          pip install safety
          safety check -r requirements.txt --full-report

      - name: Run lightweight secret scan
        run: python scripts/check_no_secrets.py

      - name: Run schema validation
        env:
          DB_PATH: ./nigeria.db
        run: python validation/validate_schema.py
